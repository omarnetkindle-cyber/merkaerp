services:
  - type: web
    name: merka-sync-server
    runtime: docker
    plan: free
    dockerfilePath: backend/merka_sync_server/Dockerfile
    dockerContext: backend/merka_sync_server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MERKA_SYNC_PUBLIC_KEY_PEM
        sync: false
